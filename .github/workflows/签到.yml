name: 签到
on:
  schedule:
    # GitHub Actions 的 schedule 只支持 UTC，不支持 timezone 字段。
    # UTC 17:10 = 北京时间 01:10（次日）
    - cron: "10 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 创建 Node 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json

      - name: 缓存依赖
        id: cache-npm
        uses: actions/cache@v6
        with:
          path: ./api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安装依赖
        run: npm run install
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}

      # 预检要读凭据文件：把 Secret 里的 USERINFO 落成 data/userinfo.json。
      # 用 printf 而不是 echo，避免凭据被回显进日志。
      - name: 准备凭据文件
        run: |
          mkdir -p data
          printf '%s' "$USERINFO" > data/userinfo.json
          echo "凭据文件已写入 $(wc -c < data/userinfo.json) 字节"
        env:
          USERINFO: ${{ secrets.USERINFO }}

      # 只读预检：概念版 SVIP 若已覆盖到明天，说明今日 8 次额度已经领满，
      # 直接跳过真实请求。这样当天被重复触发时日志不会再出现「次数已用光」的假失败。
      # 退出码：0 = 已覆盖应跳过；1/2 = 需要签到。
      - name: VIP 覆盖预检
        id: precheck
        continue-on-error: true
        run: node vip-covered.mjs

      - name: 预检结论
        if: ${{ steps.precheck.outcome == 'success' }}
        run: |
          echo "SVIP 已覆盖到明天，今日额度已领满，跳过真实请求（这不是失败）。"
          echo "如需强制重新领取，手动把 data/checkin_state.json 删掉后重跑。"

      - name: 执行签到
        if: ${{ steps.precheck.outcome != 'success' }}
        run: npm run main
        env:
          USERINFO: ${{ secrets.USERINFO }}
          PAT: ${{ secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 通知渠道
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          DINGTALK_BOT_KEY: ${{ secrets.DINGTALK_BOT_KEY }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_BOT_KEY: ${{ secrets.FEISHU_BOT_KEY }}
          YUNHU_BOT_KEY: ${{ secrets.YUNHU_BOT_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_GROUP: ${{ secrets.BARK_GROUP }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
